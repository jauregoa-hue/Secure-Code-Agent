services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: securecode
      POSTGRES_USER: securecode
      POSTGRES_PASSWORD: securecode
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securecode"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
